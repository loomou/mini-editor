name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  context:
    name: Detect CI context
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.context.outputs.should_run }}

    steps:
      - name: Detect release merge
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "push") {
              core.setOutput("should_run", "true");
              return;
            }

            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const isReleaseMerge = response.data.some((pull) =>
              pull.merged_at && pull.head.ref.startsWith("release/")
            );

            core.setOutput("should_run", isReleaseMerge ? "false" : "true");

  approval:
    name: Wait for CI approval
    runs-on: ubuntu-latest
    environment: ci-approval
    needs: context
    if: needs.context.outputs.should_run == 'true' && github.event_name != 'push'

    steps:
      - name: Approved
        run: echo "CI approved."

  format:
    name: Format
    runs-on: ubuntu-latest
    needs:
      - context
      - approval
    if: always() && needs.context.outputs.should_run == 'true' && (github.event_name == 'push' || needs.approval.result == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: format

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcursor-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked
