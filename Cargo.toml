[workspace]
members = [
    "crates/language",
    "crates/text",
    "crates/rope"
]
resolver = "3"

[workspace.package]
name = "mini-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
language = { path = "crates/ language" }
rope = { path = "crates/rope" }
text = { path = "crates/text" }
